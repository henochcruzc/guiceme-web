
<div  class="menu-gral" #menuGral [class.scroll-tabs]="modulos.length >= 5" *ngIf="modulos.length > 1">

    <ul ngbNav #nav="ngbNav" class="nav-tabs flex-row flex-nowrap w-100 flex-column flex-sm-row">
        <ng-template ngFor let-item [ngForOf]="modulos" let-index="index">
            <li  [ngbNavItem]="index" [class.w-100]="modulos.length < 5" [class.w-20]="modulos.length >= 5">
                <button ngbNavLink class="w-100 h-100 " [class.active]="index == activeTab.index" (click)="navegarA(item.idModulo.id,index)">
                    {{ item.idModulo.desModulo }}
                </button>
            </li>
        </ng-template>
    </ul>
</div>
