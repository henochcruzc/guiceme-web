<div class="header-top">
  <!-- Header-->
  <app-header></app-header>

  <!-- Header nav-->
  <div class="header-nav d-flex justify-content-between align-items-center">
    <div class="d-flex flex-row align-items-center">
      <div><span class="brand">SIICEM</span></div>
      <div><span class="separator"><svg xmlns="http://www.w3.org/2000/svg" width="1" height="20" viewBox="0 0 1 20"
            fill="none">
            <path d="M0.5 0V20" stroke="white" />
          </svg></span></div>
      <div><span class="sub-brand">Sistema Informático Integral Centros de Mezclas</span></div>
    </div>

    <div class="d-flex flex-row info-user">
      <button mat-button  *ngIf="modulos?.length >1" [matMenuTriggerFor]="menuModul" class="btn btn-primary estiloMenu" ><div class="menu-ico"></div></button>
      <mat-menu #menuModul="matMenu" class="matMenu">
        <button class="matMenuBtn" mat-menu-item *ngFor="let item of modulos; let i = index" [disabled]="i == activeTab.index" (click)="navegarB(item.idModulo.id, i)">
          <mat-icon ngClass="{{ findClass(item.idModulo.refModulo, i == activeTab.index) }}"></mat-icon>
          {{ item.idModulo.desModulo }}
        </button>
      </mat-menu>
      <!--<div class="img-user"><img src="assets/images/account_circle.svg" alt=""></div>-->
      <div class="d-flex flex-column justify-content-start " style="align-items: flex-end;"> 
        <span class="user">
          {{ name }}
        </span>
        <span class="rol">
          {{ role }} / <span class="um"> {{ooad}} </span>
        </span>
      </div>

      <div class="d-flex flex-row align-items-center">
    
        <div ><span class="separator"><svg width="1" height="32" viewBox="0 0 1 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="1" height="32" rx="0.5" fill="white"/>
          </svg>
          </span></div>
        <div><span class="brand" style="cursor: pointer;" (click)="modalSalirSesion()">Cerrar sesión

        </div>
      </div>
    </div>
  </div>
  <div class="line-h"></div>

</div>

<!--<app-tabs></app-tabs> -->

<!-- Contenido -->
<div class="main-content">
  <router-outlet name="contentido"></router-outlet>

</div>

<!-- Footer nav-->
<app-footer></app-footer>
<!-- Modal inactividad -->
<div class="modal hide-modal" #tableModalSesion>
  <div class="modal-dialog modal800">
    <div class="modal-content" style="border-radius: 15px; text-align: center;">
      <div class="modal-header" style="background-color: white;border-radius: 15px;">
        <span class="glyphicon glyphicon-remove pull-right" style="color: black;" aria-hidden="true"
          (click)="closeStopModal()"></span>
      </div>
      <div class="modal-body row" style="padding-top: 0;">
        <h4 class="text-ellipsis">La sesión está a punto de expirar</h4>
        <div class="col-md-12" style="text-align: center; margin-top: 0px;margin-bottom: 10px; font-size: 18px;">
          ¿Desea continuar?
        </div>

        <div class="col-md-12 p0" style="margin-top: 25px; margin-bottom: 25px;">
          <div class="col-md-6">
            <button type="button" class="btn btn40 btn-primary pt6" style="width: 200px;"
              (click)="closeStopModal()">Continuar</button>
          </div>

          <div class="col-md-6">
            <button type="button" class="btn btn40 btn-danger pt6" style="width: 200px;"
              (click)="salirSesion()">Salir</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
