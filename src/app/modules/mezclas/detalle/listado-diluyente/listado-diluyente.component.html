<div *ngIf="blnDatos" class="datos-diluyente container-fluid px-3">

  <!-- Primera fila de valores de mezcla -->
  <div class="row" *ngIf="paramsMezcla != undefined">
    <div class="col-lg-2 col-md-4 col-sm-6 mb-3 d-flex flex-column" *ngFor="let dato of [
      { label: 'Osmolaridad (mOsmol/ml)', value: paramsMezcla?.numOsmolaridad },
      { label: 'Nitrógeno (gr)', value: paramsMezcla?.numNitrogeno },
      { label: 'Proteínas (gr)', value: paramsMezcla?.numProteinas },
      { label: 'Kcal no proteicas (Kcal)', value: paramsMezcla?.numKcalNoProteicas },
      { label: 'Kcal totales (Kcal)', value: paramsMezcla?.numKcalTotales },
      { label: 'Volumen total (ml)', value: paramsMezcla?.numVolumenTotal }
    ]">
      <div class="d-flex flex-column">
        <span class="etiqueta">{{dato.label}}</span>
        <span class="texto">{{dato.value}}</span>
      </div>
    </div>
  </div>

  <!-- Línea divisoria -->
  <div class="hr-azul" *ngIf="showDiluyente"></div>

  <!-- Segunda fila: diluyente -->
  <div class="row" *ngIf="showDiluyente">
    <div class="col-lg-8 col-md-12 mb-3 d-flex flex-column">
      <span class="etiqueta">Diluyente</span>
      <span class="texto">{{paramsDiluyente?.desCortaDiluyente || ''}}</span>
    </div>
    <div class="col-lg-2 col-md-6 mb-3 d-flex flex-column">
      <span class="etiqueta">Dosis</span>
      <span class="texto">{{paramsDiluyente?.numDosisDiluyente}}</span>
    </div>
    <div class="col-lg-2 col-md-6 mb-3 d-flex flex-column">
      <span class="etiqueta">Unidad de medida</span>
      <span class="texto">{{paramsDiluyente?.refUnidadMinMedida}}</span>
    </div>
  </div>

  <!-- Línea divisoria -->
  <div class="hr-azul"></div>

  <!-- Tercera fila: más detalles -->
  <div class="row">
    <div class="col-lg-2 col-md-4 col-sm-6 mb-3 d-flex flex-column" *ngFor="let dato of [
      { label: 'Fecha de aplicación', value: paramsDiluyente?.fechaAplicacion },
      { label: 'Cada', value: paramsDiluyente?.desAplicacionCada },
      { label: 'Número total de dosis', value: paramsDiluyente?.totalDosis },
      { label: 'Vía de administración', value: paramsDiluyente?.desViaAdministracion },
      { label: 'Tiempo de infusión', value: paramsDiluyente?.desTiempoInfusion },
      { label: 'Velocidad de infusión (ml/hrs)', value: paramsDiluyente?.refVelInfusion }
    ]">
      <div class="d-flex flex-column">
        <span class="etiqueta">{{dato.label}}</span>
        <span class="texto">{{dato.value}}</span>
      </div>
    </div>
  </div>

</div>
