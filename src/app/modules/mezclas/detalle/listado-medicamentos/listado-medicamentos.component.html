<div class="lista-medicamento " >

    <div *ngIf="blnTitulo" class="header-table d-flex align-items-center justify-content-between " style="margin-left: 18px;">
        <div class="titulo d-flex align-items-center">
            <div class="ico-clipboard"></div>
            <span class="subtitulo">Lista de medicamentos</span>
        </div>

    </div>

    <div class="table-responsive scroll-table">
        <mat-table class="fullTable " [dataSource]="tableDS" matSortActive="desCortaMedicamento" matSortDirection="asc"
        matSort #tSort="matSort" >

            <mat-header-row *matHeaderRowDef="displayedColumns "></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns ;"></mat-row>

            <ng-container matColumnDef="desCortaMedicamento">
                <mat-header-cell class="col-md-8" *matHeaderCellDef mat-sort-header
               > Medicamentos </mat-header-cell>
                <mat-cell class="col-md-8" *matCellDef="let element">
                    {{ element.desCortaMedicamento }}

                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="numDosisMedicamento">
                <mat-header-cell class="col-md-1" *matHeaderCellDef mat-sort-header
                  > Dosis </mat-header-cell>
                <mat-cell class="col-md-1" *matCellDef="let element">
                    {{ element.numDosisMedicamento }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="refUnidadMinMedida">
                <mat-header-cell class="col-md-3" *matHeaderCellDef mat-sort-header > Unidad de medida
                </mat-header-cell>
                <mat-cell class="col-md-3" *matCellDef="let element">{{ element.refUnidadMinMedida }}</mat-cell>
            </ng-container>

        </mat-table>

    </div> 


</div>
