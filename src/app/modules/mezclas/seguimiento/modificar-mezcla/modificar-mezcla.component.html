<app-header-detalle-mezcla [headerData]="headerData"></app-header-detalle-mezcla>
<div class="card-ceme mb-5">
  <div class="card card-body">
    <div class="titulo d-flex align-items-center gap-3">
      <div class="ico-dato-paciente"></div>
      <div class="d-flex align-items-center">
        <div><span class="text-title ">Detalle de la mezcla:</span> &nbsp;<span
            class="tipo-m">{{elementoSeleccionado.tipoMezcla}}</span> </div>
      </div>
      <div class="flex-grow-1">
        <div class="ms-2 line-panel-header"></div>
      </div>
    </div>
    <!-- {{elementoSeleccionado | json}}
{{modelDetalleMezcla | json}} -->
    <form [formGroup]="formTipoMezcla">
      <formly-form [model]="modelTipoMezcla" [fields]="fieldsTipoMezcla" [form]="formTipoMezcla"></formly-form>
    </form>
    <ng-container *ngIf="elementoSeleccionado.idTipoMezcla==3">
      <app-antibiotico [mezclaAntibioticoSelect]="mezclaAntibioticoSelect"
        [modelTipoMezcla]="modelTipoMezcla"></app-antibiotico>
    </ng-container>
    <ng-container *ngIf="elementoSeleccionado.idTipoMezcla==2">
      <app-nutricion [mezclaNutricionSelect]="mezclaNutricionSelect"
        [modelTipoMezcla]="modelTipoMezcla"></app-nutricion>
    </ng-container>
  </div>


</div>
